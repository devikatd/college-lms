{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="College Learning Management System — Centralized academic management platform.">
    <title>{% block title %}College LMS{% endblock %}</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Toast Notifications (Django Messages) -->
    {% if messages %}
    <div class="toast-container" id="toast-container">
        {% for message in messages %}
        <div class="toast toast-{{ message.tags }}" role="alert">
            <span>{{ message }}</span>
            <button class="toast-close" onclick="this.parentElement.remove()" aria-label="Close">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block body %}{% endblock %}

    <!-- Auto-dismiss toasts after 5 seconds -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toasts = document.querySelectorAll('.toast');
            toasts.forEach(function(toast) {
                setTimeout(function() {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(function() { toast.remove(); }, 300);
                }, 5000);
            });
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
