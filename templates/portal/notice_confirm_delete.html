{% extends "dashboard_base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto;">
    <div class="card" style="text-align: center; padding: var(--space-2xl);">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(239, 68, 68, 0.1); color: var(--accent-rose); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-md);">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </div>
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">Delete Academic Notice?</h2>
        <p style="color: var(--text-secondary); margin-bottom: var(--space-xl);">
            Are you sure you want to permanently remove the circular <strong>"{{ notice.title }}"</strong>? This action cannot be undone.
        </p>

        <form method="post" style="display: flex; justify-content: center; gap: var(--space-md);">
            {% csrf_token %}
            <a href="{% url 'portal:notice_detail' notice.id %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn" style="background: var(--accent-rose); color: white; border: none;">Confirm Delete</button>
        </form>
    </div>
</div>
{% endblock %}
