{% extends "base.html" %}

{% block title %}404 — Page Not Found | College LMS{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: var(--space-xl);">
    <div class="card" style="max-width: 540px; width: 100%; text-align: center; padding: var(--space-2xl);">
        <div style="width: 72px; height: 72px; border-radius: 50%; background: rgba(59, 130, 246, 0.12); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-lg);">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <span style="font-size: 3rem; font-weight: 800; color: var(--primary); font-family: monospace; line-height: 1; display: block; margin-bottom: 0.5rem;">404</span>
        <h1 style="font-size: 1.5rem; font-weight: 700; margin: 0 0 0.5rem 0;">Page Not Found</h1>
        <p style="color: var(--text-secondary); margin: 0 0 var(--space-xl) 0; font-size: 0.95rem; line-height: 1.6;">
            The academic record, department resource, or circular you requested does not exist or may have been relocated.
        </p>

        <div style="display: flex; justify-content: center; gap: var(--space-md); flex-wrap: wrap;">
            <a href="/" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 0.5rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Return to Dashboard
            </a>
            <a href="{% url 'academics:global_search' %}" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 0.5rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Find Records
            </a>
        </div>
    </div>
</div>
{% endblock %}
